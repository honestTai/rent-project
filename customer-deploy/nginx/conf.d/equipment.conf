server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    location = / { return 302 /platform/; }
    location = /healthz { access_log off; return 200 'ok'; }
    # Management APIs are for container probes, not the public entry point.
    location = /gateway/actuator { return 404; }
    location ^~ /gateway/actuator/ { return 404; }

    location /platform/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /platform/index.html;
    }

    location /rent/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /rent/index.html;
    }

    location /uploads/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 7d;
    }


    location /gateway/ {
        proxy_pass http://equipment-gateway:9800/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }
}
