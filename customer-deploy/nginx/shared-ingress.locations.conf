# Add these locations to the existing port-80 server block.
# Optional: use only if both containers share a network you explicitly configure.
# The default standalone Compose entry is http://127.0.0.1:8080 instead.

# Product demo is the default page on a bare-IP visit.
location = / {
    return 302 /rent/;
}

location = /platform {
    return 301 /platform/;
}

location ^~ /platform/ {
    proxy_pass http://equipment-nginx:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /rent {
    return 301 /rent/;
}

location ^~ /rent/ {
    proxy_pass http://equipment-nginx:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /gateway/ {
    proxy_pass http://equipment-nginx:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
}

location ^~ /uploads/ {
    proxy_pass http://equipment-nginx:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
