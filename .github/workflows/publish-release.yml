name: Publish a verified Docker package
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Docker package workflow run ID reviewed for publication'
        required: true
      version:
        description: 'Version in the verified package (for example v0.1.0)'
        required: true
      publish:
        description: 'Publish after audit (false performs the package audit only)'
        type: boolean
        default: false
      use_existing_tag:
        description: 'Use a maintainer-created lightweight tag only if it exactly matches SOURCE_COMMIT'
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-docker-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate publication boundaries
        run: |
          python tools/test_check_release.py
          python tools/test_publish_release.py
          python tools/test_audit_release.py
      - name: Download and verify the pinned official Gitleaks binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/gitleaks"
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            --pattern gitleaks_8.30.1_linux_x64.tar.gz \
            --pattern gitleaks_8.30.1_checksums.txt --dir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          echo "GITLEAKS_BINARY=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
      - name: Audit selected artifact and optionally publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          PUBLICATION_REPORT: dist-audit/publication-audit.json
          USE_EXISTING_VERIFIED_TAG: ${{ inputs.use_existing_tag }}
        run: python tools/publish_release.py
      - name: Retain the redacted package audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-audit
          path: dist-audit/publication-audit.json
          if-no-files-found: warn
