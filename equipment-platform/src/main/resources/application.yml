mybatis-plus:
  mapper-locations: classpath*:/mapper/*Mapper.xml
  type-aliases-package: com.equipment.platform.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

spring:
  application:
    name: equipment-platform-service
  profiles:
    active: @env.profile@
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
